</style></head><body><header><b>🏏 IPL DS Auction</b><div id="nav"></div></header><main id="app"></main><div id="tip"></div>
<script>
const $=s=>document.querySelector(s),App=$('#app'),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;

// ---------- synthetic dataset (seeded) ----------
const NM='Verma Rao Iyer Nair Khanna Bose Menon Joshi Patil Desai Kapoor Reddy Mehta Gill Sethi Chopra Naidu Pillai Rawat Thakur Bhatt Dutta Ghosh Lal Saini Yadav Mishra Tiwari Kulkarni Shetty Bajwa Sood Malik Arora Hegde Pandey Rana Sinha Goyal Jain Chawla Dixit Bedi Kaul Gupta Singh Prasad Nayak Barua Mukherjee Banerjee Sen Pal Roy Das Basu Kar Dey Rai Trivedi'.split(' '),IN='ARVSKMHDJTNP';
const MIN={WK:1,BAT:3,BOWL:3,AR:1};

return ro.map((role,i)=>{const q=(g()+g())/2,gm=Math.round(20+g()*50),cons=Math.round(cl(35+q*40+g()*25,20,98));let avg,sr,econ=null,w=0;
if(role=='BOWL'){avg=7+q*11+g()*3;sr=85+g()*45;econ=9.4-q*2.4+g()*.6;w=Math.round(gm*(.5+q*.9))}

.sort((a,b)=>b.sc-a.sc).map((p,i)=>(p.id=i,p))})();
const SN=['','Marquee','Core','Rapid'],setOf=p=>p.id<12?1:p.id<30?2:3;P.forEach(p=>p.tier=4-setOf(p));
const IC={BAT:'<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px"><g transform="rotate(35 12 12)"><rect x="10.6" y="0.5" width="2.8" height="8" rx="1.2" fill="#a9824d"/><path d="M8.2 8.5h7.6l-.9 13.2a1.3 1.3 0 0 1-1.3 1.2h-3.2a1.3 1.3 0 0 1-1.3-1.2z" fill="#f0cf94"/></g></svg>',BOWL:'<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px"><circle cx="12" cy="12" r="9" fill="#d62d2d"/><path d="M5.5 6.5c4.5 3.5 4.5 7.5 0 11M18.5 6.5c-4.5 3.5-4.5 7.5 0 11" stroke="#fff" stroke-width="1.3" fill="none" stroke-dasharray="2 1.6"/></svg>',WK:'🧤',AR:'🏏'},ic=p=>`<span title="${p.role}">${IC[p.role]}</span>`;
const FT={avg:'Batting Avg',sr:'Strike Rate',runs:'Total Runs',econ:'Economy',w:'Wickets',cons:'Consistency',sc:'Rating',base:'Base Price (cr)'};
const val=(p,k)=>p[k];
// ---------- franchises ----------
const T=[{n:'Marina Mavericks',col:'#fbbf24',strat:'value',perk:'purse',d:'Advantage: +₹6 cr bigger purse.'},{n:'Royal Falcons',col:'#3b82f6',strat:'star',perk:'bat',d:'Advantage: batting strength ×1.06 (home pitch).'},{n:'Thunder Titans',col:'#8b5cf6',strat:'bal',perk:'bowl',d:'Advantage: bowling strength ×1.06 (pace academy).'},{n:'Sapphire Strikers',col:'#22d3ee',strat:'bargain',perk:'depth',d:'Advantage: bench depth counts 15% more.'},{n:'Gold Gladiators',col:'#f472b6',strat:'value',perk:'disc',d:'Advantage: 10% discount on every winning bid.'}];
const STR={value:'Value hunter (pays ≤85% of fair value)',star:'Star chaser (overpays for top players)',bal:'Balanced builder (buys for role needs)',bargain:'Bargain hunter (pays ≤65%)'};
// ---------- team evaluation ----------
function xi(sq){const s=[...sq].sort((a,b)=>b.sc-a.sc),x=[];for(const r in MIN)s.filter(p=>p.role==r).slice(0,MIN[r]).forEach(p=>x.push(p));s.forEach(p=>{if(x.length<11&&!x.includes(p))x.push(p)});return x.slice(0,11)}
function ev(sq,spent,perk){const x=xi(sq),bn=sq.filter(p=>!x.includes(p)).map(p=>p.sc).sort((a,b)=>b-a).slice(0,4);
let bat=mean(x.map(p=>p.bat).sort((a,b)=>b-a).slice(0,7)),bowl=mean(x.map(p=>p.bowl).sort((a,b)=>b-a).slice(0,5)),dep=mean(bn);
if(perk=='bat')bat*=1.06;if(perk=='bowl')bowl*=1.06;if(perk=='depth')dep*=1.15;bat=Math.min(bat,100);bowl=Math.min(bowl,100);dep=Math.min(dep,100);
const miss=Object.keys(MIN).reduce((s,r)=>s+Math.max(0,MIN[r]-x.filter(p=>p.role==r).length),0),bal=cl(100-Math.abs(bat-bowl)*1.2-18*miss-(x.length<11?30:0),0,100),eff=cl(100*mean(x.map(p=>p.sc))/(30+spent*.9),0,100);
return{bat,bowl,bal,dep,eff,miss,x,avg:mean(x.map(p=>p.sc)),final:.32*bat+.32*bowl+.12*bal+.1*dep+.14*eff}}
// ---------- optimisation ----------
let CM=0;const cu=p=>Math.max(1,Math.round((CM?p.base:p.fv)*2));
function greedy(it,B,K,OC,key){let rem=B,o=0,out=[];[...it].sort((a,b)=>key(b)-key(a)).forEach(p=>{const c=cu(p);if(out.length<K&&c<=rem-(K-out.length-1)&&(!p.os||o<OC)){out.push(p);rem-=c;o+=p.os?1:0}});return out}
function dp(it,B,K,OC){const W=B+1,S=OC+1,sz=(K+1)*W*S,D=new Float32Array(sz).fill(-1e9),ix=(k,b,o)=>(k*W+b)*S+o;D[0]=0;const Tk=it.map(()=>new Uint8Array(sz));
it.forEach((p,n)=>{const c=cu(p),v=p.os?1:0;for(let k=K-1;k>=0;k--)for(let b=B-c;b>=0;b--)for(let o=0;o+v<=OC;o++){const a=D[ix(k,b,o)];if(a<0)continue;const j=ix(k+1,b+c,o+v);if(a+p.sc>D[j]){D[j]=a+p.sc;Tk[n][j]=1}}});
let best=-1,bs=-1;for(let b=0;b<=B;b++)for(let o=0;o<S;o++){const j=ix(K,b,o);if(D[j]>bs){bs=D[j];best=j}}if(bs<0)return[];
const out=[];let j=best;for(let n=it.length-1;n>=0;n--)if(Tk[n][j]){out.push(it[n]);j-=W*S+cu(it[n])*S+(it[n].os?1:0)}return out}
function optimal(it,B,K,OC,mn=MIN){let f=[],rem=B,oc=OC;for(const r in mn)it.filter(p=>p.role==r&&!f.includes(p)).sort((a,b)=>b.sc/cu(b)-a.sc/cu(a)).slice(0,mn[r]).forEach(p=>{if(f.length<K&&cu(p)<=rem-(K-f.length-1)&&(!p.os||oc>0)){f.push(p);rem-=cu(p);oc-=p.os?1:0}});
const rest=it.filter(p=>!f.includes(p)),k=K-f.length;return f.concat(k>0?dp(rest,rem,k,oc):[])}
// ---------- k-means ----------
const KF=[['avg','Batting Avg'],['sr','Strike Rate'],['ec','Economy*'],['w','Wickets']],raw=p=>[p.avg,p.sr,p.econ??10.5,p.w];
const RW=P.map(raw),MN=[0,1,2,3].map(d=>Math.min(...RW.map(r=>r[d]))),MX=[0,1,2,3].map(d=>Math.max(...RW.map(r=>r[d]))),XN=RW.map(r=>r.map((v,d)=>(v-MN[d])/(MX[d]-MN[d])));
const inertia=(X,a,C)=>X.reduce((s,x,i)=>s+C[a[i]].reduce((q,v,d)=>q+(v-x[d])**2,0),0);
function km(X,k){let C=[...X].sort(()=>R()-.5).slice(0,k).map(a=>[...a]),as=[],its=[];for(let it=0;it<25;it++){const na=X.map(x=>{let b=0,bd=1e9;C.forEach((c,j)=>{const d=c.reduce((s,v,i)=>s+(v-x[i])**2,0);if(d<bd){bd=d;b=j}});return b});const ch=na.some((v,i)=>v!=as[i]);as=na;C=C.map((c,j)=>{const m=X.filter((_,i)=>as[i]==j);return m.length?c.map((_,d)=>mean(m.map(x=>x[d]))):c});its.push({a:as,C:C.map(c=>[...c]),i:inertia(X,as,C)});if(!ch)break}return its}
// ---------- charts ----------
const tip=$('#tip');

const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),X=v=>m.l+(v-x0)/((x1-x0)||1)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/((y1-y0)||1)*(H-m.t-m.b);
g.fillStyle='#8f9acb';g.font='11px system-ui';g.strokeStyle='#232a62';
for(let i=0;i<=4;i++){const a=x0+(x1-x0)*i/4,b=y0+(y1-y0)*i/4;g.beginPath();g.moveTo(X(a),m.t);g.lineTo(X(a),H-m.b);g.moveTo(m.l,Y(b));g.lineTo(W-m.r,Y(b));g.stroke();g.textAlign='center';g.fillText(r1(a),X(a),H-m.b+14);g.textAlign='right';g.fillText(r1(b),m.l-5,Y(b)+4)}
g.textAlign='center';g.fillText(xl,(W+m.l)/2,H-5);g.save();g.translate(11,H/2);g.rotate(-Math.PI/2);g.fillText(yl,0,0);g.restore();
pts.forEach(p=>{p.px=X(p.x);p.py=Y(p.y);g.fillStyle=p.c;g.globalAlpha=.85;g.beginPath();g.arc(p.px,p.py,5,0,7);g.fill()});g.globalAlpha=1;if(ex)ex(g,X,Y);
cv.onmousemove=e=>{const b=cv.getBoundingClientRect(),h=pts.find(p=>Math.hypot(p.px-(e.clientX-b.left),p.py-(e.clientY-b.top))<8);if(h){tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.innerHTML=h.t}else tip.style.display='none'};cv.onmouseleave=()=>tip.style.display='none'}

// ---------- state ----------

const s=P,sh=a=>a.sort(()=>R()-.5);A={lots:[...sh(s.slice(0,12)).map(p=>({id:p.id,r:1})),...sh(s.slice(12,30)).map(p=>({id:p.id,r:2})),...sh(s.slice(30)).map(p=>({id:p.id,r:3}))],i:-1,log:[],pl:[]};SR=null}

<button class="gold" onclick="newGame();S.max=1;go('team')">↻ Replay</button></div><div class="card"><b>Missions</b><br>${mlist().map(x=>`<p class="${x[1]?'ok':'mu'}">${x[1]?'✅':'⬜'} ${x[0].split(':')[0]}</p>`).join('')}<b>Achievements</b><br>${AL.map(a=>`<p class="${ST.ach.includes(a)?'ok':'mu'}">${ST.ach.includes(a)?'🏆':'🔒'} ${a}</p>`).join('')}</div></div>`};
// ---------- GUIDE & PLAYTEST ----------
V.guide=()=>{App.innerHTML=`<div class="card"><h2>Learning objectives</h2><p>By the end of the game you should be able to:</p><ol><li><b>Statistics:</b> calculate and interpret mean, median, standard deviation, min and max, and explain why consistency matters.</li><li><b>Correlation:</b> read a correlation coefficient r and a scatter plot, and explain why association is not causation (confounders).</li><li><b>K-means clustering:</b> explain how K-means groups data, how K and inertia change the result, and how groups reveal undervalued players.</li><li><b>Optimisation:</b> allocate a limited budget under constraints to get the best combined result, instead of picking the best individuals.</li></ol><p class="mu"><b>You discover them by playing:</b> change K and watch the clusters move; hold role constant and watch r change; change the budget and watch squad strength change; change your bids and watch your purse, your squad and your rivals change.</p></div><div class="card"><h2>How to Play</h2><p><b>Goal:</b> build the strongest cricket team with <b>₹100 crore</b> and finish above 4 AI rivals.</p>
<ol><li><b>Pick a team.</b> Each has one small advantage.</li><li><b>Scout in the Data Lab.</b> Use the 4 tabs to find good, steady, cheap players. Star (☆) your favourites and complete the analyst missions for bonus points.</li><li><b>Win players in the Auction.</b> Press <b>Bid</b> or <b>Jump</b> to raise the price, or <b>Pass</b>. You get 12 seconds, and every bid gives you at least 8 more. Do not bid above a player's Fair ₹. Players come in 3 sets by rating: Marquee (top 12), Core (next 18) and Rapid (last 30). The order inside a set is random.</li><li><b>Complete your squad.</b> Sign leftover players at their base price.</li><li><b>Season and Results.</b> The game scores your best 11 and ranks all five teams.</li></ol></div>
<div class="card"><b>Squad rules</b><ul><li>11 to 15 players in total.</li><li>At least 1 wicketkeeper (WK), 3 batters (BAT), 3 bowlers (BOWL) and 1 all-rounder (AR).</li><li>No more than 6 overseas players (✈).</li><li>You cannot overspend: keep ₹0.5 cr for every spot still needed to reach 11.</li></ul>
<b>Key words</b><ul><li><b>Rating:</b> a 0–100 overall score for a player.</li><li><b>Fair ₹:</b> what the analysts think the player is worth.</li><li><b>Base:</b> the starting bid.</li><li><b>Value ×:</b> Fair ÷ Base. Higher means a better bargain.</li><li><b>Icons:</b> ${IC.BAT} batter · ${IC.BOWL} bowler · 🧤 wicketkeeper · 🏏 all-rounder.</li></ul></div>
<div class="card"><b>The 4 data science tools, and why we need them</b>
<p>🔢 <b>Statistics</b> — <i>summarises many numbers into a few.</i><br>Why: you can't compare 60 players by eye. Averages and spread show who is good and who is steady.<br>In the game: Data Lab table, and the Rating that comes from avg, strike rate, wickets, economy and consistency.</p>
<p>📈 <b>Correlation</b> — <i>checks if two numbers move together.</i><br>Why: to avoid being fooled. A pattern does not mean one thing causes the other.<br>In the game: scatter plots that warn you not to judge a player by one stat.</p>
<p>🧩 <b>K-means clustering</b> — <i>automatically groups similar players.</i><br>Why: to find cheaper look-alikes of expensive stars and to build a squad of different types.<br>In the game: coloured groups and "hidden gems".</p>
<p>🧮 <b>Optimisation</b> — <i>finds the best choice under limits.</i><br>Why: money and squad spots are limited, so you need the best mix, not just the best names.<br>In the game: the three strategies, the Live advisor and the signing suggestions in the Squad Builder.</p></div>
<div class="card"><b>How your team is scored</b><p>Team strength out of 100 = Batting 32% + Bowling 32% + Balance 12% + Depth 10% + Budget efficiency 14%.</p><ul><li><b>Batting / Bowling:</b> your best 7 batters and best 5 bowlers in the XI.</li><li><b>Balance:</b> are batting and bowling level, and are all roles covered?</li><li><b>Depth:</b> how good your bench is.</li><li><b>Efficiency:</b> strength per rupee spent.</li></ul><p class="mu">Each team plays every other twice. Stronger teams are more likely to win, and the points come from that calculation, not from luck. All players and numbers are synthetic, not official IPL records.</p></div>`};
const pr6=r=>{r=[...(r||[])];if(r.length==5)r.splice(2,0,'');while(r.length<6)r.push('');return r};
function psum(){const rs=ST.pt.map(pr6).filter(r=>r.some(v=>v.trim())),c=rs.filter(r=>/^y/i.test(r[1].trim())).length;return`Testers recorded: <b>${rs.length}</b> · Completed the game: <b>${c}</b>${rs.length?' ('+Math.round(100*c/rs.length)+'%)':''}`}
function sp(i,j,v){if(!ST.pt.length)ST.pt=Array(5).fill(0).map(()=>pr6());ST.pt[i]=pr6(ST.pt[i]);ST.pt[i][j]=v;save();const e=$('#psum');if(e)e.innerHTML=psum()}
V.test=()=>{const rows=(ST.pt.length?ST.pt:Array(5).fill(0).map(()=>[])).map(pr6),H=['Tester (optional)','Completed?','Final rank / outcome','Concepts understood','Difficulties','Feedback / suggestions'];
App.innerHTML=`<div class="card"><h2>Playtest Report</h2><p class="mu">Blank by design. Record only real classmates who actually played your game. Entries are saved in this browser.</p><p><b>How to run a playtest:</b> let a classmate play without helping, then ask: <i>“What happens when you change K?”</i> · <i>“Why did r change when role was held fixed?”</i> · <i>“Why can’t you just buy all the stars?”</i> · <i>“What does a high standard deviation tell you?”</i> Write their answers in their own words below.</p><p id="psum">${psum()}</p><div class="sc"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td><input class="t" style="min-width:130px" value="${v.replace(/"/g,'&quot;')}" onchange="sp(${i},${j},this.value)"></td>`).join('')}</tr>`).join('')}</table></div><br><button onclick="if(!ST.pt.length)ST.pt=Array(5).fill(0).map(()=>pr6());ST.pt.push(pr6());save();V.test()">+ Add row</button></div>`};
draw();
</script></body></html>
